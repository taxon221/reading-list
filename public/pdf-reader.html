<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <title>PDF Reader</title>
        <style>
            :root {
                color-scheme: light;
                --pdf-bg: #f5f6f8;
                --pdf-status-bg: #ffffff;
                --pdf-status-border: #e5e7eb;
                --pdf-text: #111827;
                --pdf-page-bg: #ffffff;
                --pdf-page-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
            }

            :root.dark {
                color-scheme: dark;
                --pdf-bg: #111111;
                --pdf-status-bg: #1a1a1a;
                --pdf-status-border: #2d2d2d;
                --pdf-text: #f3f4f6;
                --pdf-page-bg: #ffffff;
                --pdf-page-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            }

            body {
                margin: 0;
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    Segoe UI,
                    Roboto,
                    Helvetica,
                    Arial,
                    sans-serif;
                background: var(--pdf-bg);
                color: var(--pdf-text);
            }

            #status {
                position: sticky;
                top: 0;
                z-index: 3;
                padding: max(0.5rem, env(safe-area-inset-top)) 0.75rem 0.5rem;
                font-size: 0.8125rem;
                background: var(--pdf-status-bg);
                border-bottom: 1px solid var(--pdf-status-border);
            }

            #pdf-container {
                padding: 0.75rem max(0.75rem, env(safe-area-inset-right))
                    max(0.75rem, env(safe-area-inset-bottom))
                    max(0.75rem, env(safe-area-inset-left));
            }

            .pdf-page {
                position: relative;
                width: fit-content;
                margin: 0 auto 0.9rem;
                background: var(--pdf-page-bg);
                box-shadow: var(--pdf-page-shadow);
            }

            .pdf-canvas {
                display: block;
            }

            .textLayer {
                position: absolute;
                inset: 0;
                overflow: hidden;
                line-height: 1;
                text-size-adjust: none;
            }

            .textLayer span,
            .textLayer br {
                position: absolute;
                white-space: pre;
                color: transparent;
                transform-origin: 0% 0%;
                cursor: text;
            }

            .textLayer ::selection {
                background: rgba(59, 130, 246, 0.28);
            }
        </style>
    </head>
    <body>
        <div id="status">Loading PDF...</div>
        <div id="pdf-container"></div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
        <script src="/static/pdf-reader.js"></script>
    </body>
</html>
